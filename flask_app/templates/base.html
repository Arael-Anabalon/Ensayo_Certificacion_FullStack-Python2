<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="araelanabalon@liceovvh.cl">
    <title>TaskTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>

<body class="bg-light">
    {% if session['usuario_id'] %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/tareas">
                <i class="bi bi-check-square-fill"></i>
                <span>TaskTrack</span>
            </a>
            <div class="navbar-nav me-auto">
                <a class="nav-item nav-link" href="/tareas">Mis Tareas</a>
                <a class="nav-item nav-link" href="/categorias">Categorías</a>
            </div>
            <div class="navbar-nav">
                <span class="nav-item nav-link text-white me-2">Hola, {{ session['usuario_nombre'] }}</span>
                <a class="nav-item nav-link btn btn-danger btn-sm text-white" href="/usuarios/logout">Cerrar Sesión</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% block contenido %}
        {% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>

</html>
