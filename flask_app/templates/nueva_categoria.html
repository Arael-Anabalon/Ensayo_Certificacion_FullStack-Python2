{% extends 'base.html' %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow-sm">
        <h3 class="fw-bold mb-3">Añadir Nueva Categoría</h3>

        {% with messages = get_flashed_messages(category_filter=["categoria"]) %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger py-2">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/categorias/crear" method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre de la Categoría:</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej: Universidad, Hogar, Trabajo..."
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción de la Categoría:</label>
                <textarea name="descripcion" class="form-control" placeholder="Escribe una breve descripción aquí..."
                    rows="3" required></textarea>
            </div>

            <button type="submit" class="btn btn-dark">Guardar Categoría</button>
            <a href="/categorias" class="btn btn-light border">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
